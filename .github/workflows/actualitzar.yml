# Cada dia feiner, després del tancament de Wall Street, descarrega les dades,
# calcula els indicadors, envia alertes si n'hi ha de noves i publica el dashboard.
name: Actualitzar dades i publicar

on:
  schedule:
    - cron: "37 22 * * 1-5"   # 22:37 UTC: 23:37 a Espanya a l'hivern, 00:37 a l'estiu
  workflow_dispatch:           # botó "Run workflow" per executar-lo a mà
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-tech
  cancel-in-progress: false

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: pip install -r requirements.txt

      - name: Descarregar dades i calcular indicadors
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/update.py

      - name: Desar les dades al repositori
        run: |
          git config user.name "radar-tech-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Dades actualitzades $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
